[project]
name = "sweeptune"
version = "0.1.0"
description = "Measure your room with a sweep and get settings for a 10-band graphic EQ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maximilian Schuh" }]
keywords = ["audio", "room-correction", "acoustics", "equalizer", "measurement"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "sounddevice>=0.5",
    "soundfile>=0.12",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.9",
]

[project.scripts]
sweeptune = "sweeptune.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sweeptune"]

[tool.pytest.ini_options]
testpaths = ["tests"]
